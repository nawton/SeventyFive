#replay{position:absolute;bottom:22px;left:14px;z-index:1100;background:linear-gradient(140deg,#FF9D68,#F2652A);color:#14100B;border:none;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 10px 28px rgba(242,101,42,0.4);transition:transform 0.2s ease}
#replay:hover{transform:translateY(-2px)}
.hint{position:absolute;bottom:22px;right:14px;z-index:1100;background:rgba(255,255,255,0.92);color:#4B5468;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:500;box-shadow:0 6px 18px rgba(20,25,45,0.15)}

const map = L.map('map', { scrollWheelZoom: false });
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap-bidragsgivarna © CARTO', maxZoom: 20
}).addTo(map);
map.fitBounds(L.latLngBounds(route), { padding: [50, 50] });
map.on('click', () => map.scrollWheelZoom.enable());

L.polyline(route, { color: '#2B4BD7', weight: 4, opacity: 0.18 }).addTo(map);
const drawn = L.polyline([route[0]], { color: '#2B4BD7', weight: 5, opacity: 0.95 }).addTo(map);
L.circleMarker(route[0], { radius: 6, color: '#fff', weight: 2.5, fillColor: '#101B45', fillOpacity: 1 }).addTo(map).bindTooltip('Start');
const runner = L.circleMarker(route[0], { radius: 8, color: '#fff', weight: 3, fillColor: '#F2652A', fillOpacity: 1 }).addTo(map);

// Kumulativa avstånd längs rundan
const cum = [0];
for (let i = 1; i < route.length; i++) cum.push(cum[i-1] + L.latLng(route[i-1]).distanceTo(L.latLng(route[i])));
const total = cum[cum.length-1];
const PACE = 332; // sek per km (5:32)
const DUR = 13000, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const fmtTime = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function setProgress(p) {
  const d = total * p;
  let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
  const f = (d - cum[i-1]) / (cum[i] - cum[i-1] || 1);
  const a = route[i-1], b = route[i];
  const pos = [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f];
  drawn.setLatLngs(route.slice(0, i).concat([pos]));
  runner.setLatLng(pos);
  $('dist').innerHTML = (d/1000).toFixed(2).replace('.', ',') + '<small>km</small>';
  $('time').textContent = fmtTime(d/1000 * PACE);
}
let raf;
function play() {
  cancelAnimationFrame(raf);
  if (reduce) { setProgress(1); return; }
  const t0 = performance.now();
  const tick = t => {
    const p = Math.min(1, (t - t0) / DUR);
    setProgress(0.5 - 0.5 * Math.cos(p * Math.PI)); // mjuk in/ut
    if (p < 1) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
$('replay').addEventListener('click', play);
play();
